<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justin Philips CRM</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login"><form id="loginForm" class="login-card"><div class="logo">JP</div><h1>Justin Philips CRM</h1><p>Log in om verder te gaan</p><input id="email" type="email" placeholder="E-mailadres" required><input id="password" type="password" placeholder="Wachtwoord" required><button type="submit">Inloggen</button><small id="loginError"></small></form></div>
<div id="app" hidden><aside><div class="brand"><b>JP</b><span>JUSTIN PHILIPS<br><small>CRM</small></span></div><nav><button class="active" data-page="dashboard">Dashboard</button><button data-page="customers">Klanten</button><button data-page="jobs">Opdrachten</button><button data-page="planning">Planning</button></nav></aside>
<main><header><div><h1 id="title">Dashboard</h1><a href="#" id="logout">Uitloggen</a></div><button id="newCustomer">+ Nieuwe klant</button></header>
<section id="dashboard" class="page active"><div class="stats"><article><small>KLANTEN</small><strong id="nCustomers">0</strong></article><article><small>OPENSTAAND</small><strong id="nOpen">0</strong></article><article><small>KOMENDE 7 DAGEN</small><strong id="nWeek">0</strong></article><article><small>OMZET</small><strong id="revenue">€ 0,00</strong></article></div><div class="grid"><article><h2>Recente opdrachten</h2><div id="recent"></div></article><article><h2>Vandaag</h2><div id="today"></div></article></div></section>
<section id="customers" class="page"><div class="toolbar"><input id="customerSearch" placeholder="Zoek klant, telefoon, e-mail of adres…"><button id="newCustomer2">+ Nieuwe klant</button></div><article class="table"><table><thead><tr><th>Klant</th><th>Contact</th><th>Adres</th><th></th></tr></thead><tbody id="customerRows"></tbody></table></article></section>
<section id="jobs" class="page"><div class="toolbar"><select id="statusFilter"><option value="">Alle statussen</option><option>Offerte</option><option>Ingepland</option><option>Moet nog op inspectie</option><option>Service</option><option>Gefactureerd</option><option>Betaald</option></select><button id="newJob">+ Nieuwe opdracht</button></div><div id="jobCards" class="cards"></div></section>
<section id="planning" class="page"><article><h2>Planning</h2><div id="planningRows"></div></article></section></main></div>
<dialog id="customerDialog"><form id="customerForm"><h2>Nieuwe klant</h2><input name="name" placeholder="Naam *" required><input name="phone" placeholder="Telefoon"><input name="email" type="email" placeholder="E-mail"><input name="address" placeholder="Adres"><textarea name="notes" placeholder="Notities"></textarea><div class="actions"><button type="button" class="cancel">Annuleren</button><button>Opslaan</button></div></form></dialog>
<dialog id="jobDialog"><form id="jobForm"><h2 id="jobHeading">Nieuwe opdracht</h2><label>Klant</label><input id="pickSearch" placeholder="Zoek klant…" autocomplete="off"><div id="picker"></div><input type="hidden" name="customer_id" id="customerId"><input name="title" placeholder="Werkzaamheden *" required><input name="job_date" type="datetime-local"><select name="status"><option>Offerte</option><option>Ingepland</option><option>Moet nog op inspectie</option><option>Service</option><option>Gefactureerd</option><option>Betaald</option></select><input name="amount" type="number" step=".01" min="0" placeholder="Bedrag €"><textarea name="notes" placeholder="Notities"></textarea><div class="actions"><button type="button" class="cancel">Annuleren</button><button>Opslaan</button></div></form></dialog>
<dialog id="detailDialog" class="detail"><button class="x">×</button><small>KLANTDOSSIER</small><h2 id="detailName"></h2><div id="detailInfo"></div><div class="detailbuttons"><button id="detailNewJob">+ Nieuwe opdracht</button><a id="call">Bellen</a><a id="wa" target="_blank">WhatsApp</a></div><h3>Opdrachthistorie</h3><div id="detailJobs"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
